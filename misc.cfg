[filament_motion_sensor motion_sensor]
detection_length: 5
extruder: extruder
switch_pin: !PG14
pause_on_runout: True
runout_gcode:
  BEEP
  RESPOND TYPE=command MSG="No filament motion in extruder"
#insert_gcode:
#event_delay:
#pause_delay:

[filament_motion_sensor motion_sensor1]
detection_length: 5
extruder: extruder1
switch_pin: !PG15
pause_on_runout: True
runout_gcode:
  BEEP
  RESPOND TYPE=command MSG="No filament motion in extruder1"
#insert_gcode:
#event_delay:
#pause_delay:

[filament_switch_sensor switch_sensor]
switch_pin: ^ebb: PB3
pause_on_runout: True
event_delay: 3.0
pause_delay: 0.5
insert_gcode:
  FILAMENT_LOAD
runout_gcode:
  # BEEP
  RESPOND TYPE=command MSG="Filament out in extruder"

[filament_switch_sensor switch_sensor1]
switch_pin: ^ebb1: PB3
pause_on_runout: True
event_delay: 3.0
pause_delay: 0.5
insert_gcode:
  FILAMENT_LOAD
runout_gcode:
  # BEEP
  RESPOND TYPE=command MSG="Filament out in extruder"

[output_pin _BEEPER_pin]
pin: rpi:gpiochip1/gpio114
value: 0
shutdown_value: 0

[skew_correction]

[idle_timeout]
timeout: 14400

[virtual_sdcard]
path: ~/printer_data/gcodes
on_error_gcode: 
  CLEAR_PAUSE
  POWER_LOSS_TIMER_STOP
  SYNC_EXTRUDER_MOTION EXTRUDER=extruder1 MOTION_QUEUE=extruder1
  IDEX_MODE
  SET_DUAL_CARRIAGE CARRIAGE=0 MODE=PRIMARY
  M107
  M84

[exclude_object]

[pause_resume]
recover_velocity: 300

[display_status]

[gcode_arcs]
  resolution: 0.1

[respond]

[sdcard_loop]

[save_variables]
filename: ~/printer_data/config/variables.klip