[heater_generic filament_dryer]
heater_pin: PA2
max_power: 0.5
sensor_type: Generic 3950
sensor_pin: PF5
control: pid
pwm_cycle_time: 0.3
min_temp: 0
max_temp: 110
pid_Kp=26.737
pid_Ki=0.406
pid_Kd=440.156

[heater_generic filament_dryer1]
heater_pin: PA3
max_power: 0.5
sensor_type: Generic 3950
sensor_pin: PF6
control: pid
pwm_cycle_time: 0.3
min_temp: 0
max_temp: 110
pid_Kp=26.737
pid_Ki=0.406
pid_Kd=440.156

[verify_heater filament_dryer]
max_error: 240
check_gain_time: 120
heating_gain: 1

[verify_heater filament_dryer1]
max_error: 240
check_gain_time: 120
heating_gain: 1

[heater_fan filament_dryer_fan]
fan_speed: 1
pin: PA8
heater: filament_dryer
heater_temp: 50
shutdown_speed: 0

[heater_fan filament_dryer_fan1]
fan_speed: 1
pin: PE5
heater: filament_dryer1
heater_temp: 50
shutdown_speed: 0

[delayed_gcode _DRYER_OFF]
gcode:
    {% set idle_timeout = printer.configfile.settings.idle_timeout.timeout %}

    SET_IDLE_TIMEOUT TIMEOUT={idle_timeout}
    SET_HEATER_TEMPERATURE HEATER=filament_dryer TARGET=0
    SET_HEATER_TEMPERATURE HEATER=filament_dryer1 TARGET=0

[gcode_macro DRYER_OFF]
gcode:
    {% set idle_timeout = printer.configfile.settings.idle_timeout.timeout %}
    
    SET_HEATER_TEMPERATURE HEATER=filament_dryer TARGET=0
    SET_HEATER_TEMPERATURE HEATER=filament_dryer1 TARGET=0
    SET_IDLE_TIMEOUT TIMEOUT={idle_timeout}
    UPDATE_DELAYED_GCODE ID=_DRYER_OFF DURATION=0

[gcode_macro DRY_FILAMENT]
gcode:
    {% set temp = params.TEMPERATURE|default(55)|int %} 
    {% set time = params.TIME|default(3)|int *3600 %}
    
    SET_HEATER_TEMPERATURE HEATER=filament_dryer TARGET={temp}
    SET_IDLE_TIMEOUT TIMEOUT={time}
    UPDATE_DELAYED_GCODE ID=_DRYER_OFF DURATION={time}

[gcode_macro PLA]
variable_temp: 55
variable_time: 3
gcode:
    DRY_FILAMENT TEMPERATURE={temp} TIME={time}

[gcode_macro PETG]
variable_temp: 65
variable_time: 4
gcode:
    DRY_FILAMENT TEMPERATURE={temp} TIME={time}

[gcode_macro ABS]
variable_temp: 80
variable_time: 4
gcode:
    DRY_FILAMENT TEMPERATURE={temp} TIME={time}

[gcode_macro TPU]
variable_temp: 60
variable_time: 4
gcode:
    DRY_FILAMENT TEMPERATURE={temp} TIME={time}

[gcode_macro PA]
variable_temp: 90
variable_time: 10
gcode:
    DRY_FILAMENT TEMPERATURE={temp} TIME={time}