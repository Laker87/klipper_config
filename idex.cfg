# This file contains a configuration snippet for a dual extruder
# printer using dual carriages (an "IDEX" printer).

# See docs/Config_Reference.md for a description of parameters.

# Definition for the secondary carriage and extruder1

##	Connected to Motor3
[dual_carriage]
axis: x
safe_distance: 56
step_pin: PG0
dir_pin: !PG1
enable_pin: !PF15
microsteps: 256
full_steps_per_rotation: 200  #set to 400 for 0.9 degree stepper
rotation_distance: 29.825
endstop_pin: ebb1: PB6 #PG11
position_endstop: 478.6
position_min: 16
position_max: 479.0
homing_speed: 80
homing_retract_dist: 5
second_homing_speed: 5

##	Connected to Motor7
[extruder1]
step_pin: ebb1: PD0 #PE6
dir_pin: !ebb1: PD1 #PA14
enable_pin: !ebb1: PD2 #!PE0
microsteps: 16
full_steps_per_rotation: 200    #200 for 1.8 degree, 400 for 0.9 degree
rotation_distance: 52.65    #HGX Drive Gears
gear_ratio: 9.57647:1
nozzle_diameter: 0.400
filament_diameter: 1.75
heater_pin: ebb1: PB13 #PA3
sensor_type: PT1000
sensor_pin: ebb1: PA3 #PF5
pullup_resistor: 2230 #2110
min_temp: 10
max_temp: 320
max_power: 1.0
min_extrude_temp: 180
max_extrude_only_distance: 500
smooth_time: 0.5
control = pid
pid_kp = 30.354
pid_ki = 2.772
pid_kd = 83.095
pressure_advance: 0.0
pressure_advance_smooth_time: 0.04

# Helper script to park the carriage (called from T0 and T1 macros)
[gcode_macro PARK_extruder]
gcode:
    {% if "xy" in printer.toolhead.homed_axes %} 
      SAVE_GCODE_STATE NAME=park0
      G90
      G1 X{printer.configfile.settings.stepper_x.position_min+0.2} F18000
      RESTORE_GCODE_STATE NAME=park0
    {% endif %}

# Activate the primary extruder
[gcode_macro T0]
gcode:
    # SYNC_EXTRUDER_MOTION EXTRUDER=extruder MOTION_QUEUE=extruder
    # TOOLCHANGE T=0
    SET_GCODE_OFFSET X=0 Y=0
    {% if printer.toolhead.extruder != "extruder" %}
        # SET_STEPPER_ENABLE STEPPER=extruder ENABLE=1
        # SET_STEPPER_ENABLE STEPPER=extruder1 ENABLE=0
        ACTIVATE_EXTRUDER EXTRUDER=extruder
    {% endif %}
    {% if printer.dual_carriage.carriage_1 == "PRIMARY" %}
        PARK_extruder1
        SET_DUAL_CARRIAGE CARRIAGE=0
        SET_SERVO SERVO=fan_servo ANGLE=135
        M400
        SET_SERVO SERVO=fan_servo WIDTH=0
        SWAP_CLEAN
    {% endif %}

[gcode_macro PARK_extruder1]
gcode:
    {% if "xy" in printer.toolhead.homed_axes %} 
      SAVE_GCODE_STATE NAME=park1
      G90
      G1 X{printer.configfile.settings.dual_carriage.position_max-0.2} F18000
      RESTORE_GCODE_STATE NAME=park1
    {% endif %}

# Activate the secondary extruder
[gcode_macro T1]
gcode:
    # SYNC_EXTRUDER_MOTION EXTRUDER=extruder1 MOTION_QUEUE=extruder1
    # TOOLCHANGE T=1
    SET_GCODE_OFFSET X=0 Y=1.1
    {% if printer.toolhead.extruder != "extruder1" %}
        # SET_STEPPER_ENABLE STEPPER=extruder ENABLE=0
        # SET_STEPPER_ENABLE STEPPER=extruder1 ENABLE=1
        ACTIVATE_EXTRUDER EXTRUDER=extruder1
    {% endif %}
    {% if printer.dual_carriage.carriage_0 == "PRIMARY" %}
        PARK_extruder
        SET_DUAL_CARRIAGE CARRIAGE=1
        SET_SERVO SERVO=fan_servo ANGLE=45
        M400
        SET_SERVO SERVO=fan_servo WIDTH=0
        SWAP_CLEAN
    {% endif %}

[gcode_macro SWAP_CLEAN]
gcode:
    SAVE_GCODE_STATE NAME=SWAP
    M83
    G1 E10 F100
    G1 E-0.5 F1800
    G91
    {% if printer.dual_carriage.carriage_0 == "PRIMARY" %}
        G1 X20 F18000
        G1 X-20 F18000
        G1 X20 F18000
        G1 X-20 F18000
        G1 X20 F18000
        G1 X-20 F18000
    {% elif printer.dual_carriage.carriage_1 == "PRIMARY" %}
        G1 X-20 F18000
        G1 X20 F18000
        G1 X-20 F18000
        G1 X20 F18000
        G1 X-20 F18000
        G1 X20 F18000
    {% endif %}
    RESTORE_GCODE_STATE NAME=SWAP

[gcode_macro calibrate_separation]
gcode:
    {% set extruder_temp = params.EXTRUDER_TEMP|default(230)|float %}
    {% set extruder1_temp = params.EXTRUDER1_TEMP|default(230)|float %}
    {% set bed_temp = params.BED_TEMP|default(85)|float %}
    SET_HEATER_TEMPERATURE HEATER=heater_bed TARGET={bed_temp}
    SET_HEATER_TEMPERATURE HEATER=extruder TARGET={extruder_temp}
    SET_HEATER_TEMPERATURE HEATER=extruder1 TARGET={extruder1_temp}
    G28
    G90
    M83
    G1 Z10 F600
    TEMPERATURE_WAIT SENSOR=heater_bed MINIMUM={bed_temp}
    TEMPERATURE_WAIT SENSOR=extruder MINIMUM={extruder_temp}
    TEMPERATURE_WAIT SENSOR=extruder1 MINIMUM={extruder1_temp}
    CLEAN_NOZZLE
    G92 E0  
    T0 ; test T0
    G1 X175 Y150 Z.2 F10000
    G1 Y75 E6
    G1 E-2
    T1 ; test T1
    G1 X175 Y1 Z.2 F10000
    G1 Y74 E6
    G1 E-2
    G1 X400
    G1 Y5
    G1 Z100 F600

[gcode_macro TOOLCHANGE]
gcode:
    # config

    {% set speed = 21000 %}
    {% set z_speed = 8 %}
    {% set config_z_hop = 2.0 %}
    {% set printable_x_max = printer.toolhead.axis_maximum.x|float %}
    {% set center_x = printer.toolhead.axis_maximum.x/2|float %}
    {% set acceleration = printer.toolhead.max_accel|float %}
    {% set idex_mode = printer["dual_carriage"].carriage_1|lower %}
    {% set act_t = 1 if idex_mode == 'primary' else 0 %}
    {% set parking_position_t0 = printer.configfile.settings.stepper_x.position_min+0.2|float %}
    {% set parking_position_t1 = printer.configfile.settings.dual_carriage.position_max-0.2|float %}
    {% set parking_position_act_t = parking_position_t0 if act_t == 0 else parking_position_t1 %}
    {% set default_toolhead = 0 %}

    # parameters 
    {% set new_t = params.T|default(-1)|int %}
    {% set new_x = params.X|default(-1.0)|float %}
    {% set new_y = params.Y|default(-1.0)|float %}
    {% set new_z = params.Z|default(-1.0)|float %}         # currently unused, represents the printing z-height after the toolchange
    {% set park_t0 = params.PARK_T0|default(-1)|float %}
    {% set park_t1 = params.PARK_T1|default(-1)|float %}
    {% set toolshift = true if params.TOOLSHIFT|default(true)|lower == 'true' else false %}
    {% set is_printing_gcode = true if printer["gcode_macro START_PRINT"].is_printing_gcode|default(true)|lower == 'true' else false %}

    DEBUG_ECHO PREFIX="_TOOLCHANGE" MSG="T: {new_t}, X: {new_x}, Y: {new_y}, Z: {new_z}, PARK_T0: {park_t0}, PARK_T1: {park_t1}, IS_PRINTING_GCODE: {is_printing_gcode}, TOOLSHIFT: {toolshift}"

    RESPOND TYPE=command MSG="Starting"

    # change toolhead
    {% if not is_printing_gcode and not toolshift %}

        DEBUG_ECHO PREFIX="_TOOLCHANGE" MSG="Changing tool to T{new_t} without retracting/extruding or moving the toolheads except for parking."

        # park toolhead
        {% if "xyz" in printer.toolhead.homed_axes %}
            G1 X{parking_position_act_t} F{speed}
        {% endif %}
        # activate new carriage and offset
        SET_DUAL_CARRIAGE CARRIAGE={new_t} MODE=PRIMARY

        # set offset
#        _SET_TOOLHEAD_OFFSET T={new_t} MOVE={1 if "xyz" in printer.toolhead.homed_axes else 0}

        # activate new extruder
        ACTIVATE_EXTRUDER EXTRUDER=extruder{'' if new_t == 0 else new_t}

    {% else %}
        # absolute positioning
        G90
        DEBUG_ECHO PREFIX="_TOOLCHANGE" MSG="Changing tool to T{new_t} with retracting/extruding and moving the toolheads."
        # set toolchange acceleration
        {% set max_accel = printer.toolhead.max_accel|float %}
        {% set square_corner_velocity = printer.toolhead.square_corner_velocity|float %}
        SET_VELOCITY_LIMIT ACCEL={acceleration} MINIMUM_CRUISE_RATIO=0 SQUARE_CORNER_VELOCITY=20

        # manual tool switching, bring new tool to the printable center
        # {% if not is_printing_gcode and toolshift and new_x < 0 and new_y < 0 %}
        RESPOND TYPE=command MSG="Test1"
        # {% set new_x = center_x %}
        {% set new_x = printer.gcode_move.gcode_position.x|float %}
        {% set new_y = printer.gcode_move.gcode_position.y|float %}
        # {% endif %}

        {% if new_x < 0 or new_y < 0 %}     
            # park the active toolhead and activate new toolhead without moving it
            RESPOND TYPE=command MSG="Test2"
            # z-hop before parking (zhop will bail outside of a print)
            DEBUG_ECHO PREFIX="_TOOLCHANGE" MSG="No new X or Y position given, parking the active toolhead and activating the new toolhead without moving it."
#            _ZHOP_BEFORE_TOOLCHANGE Z_HOP={config_z_hop} T={new_t} 

            # park toolhead
            {% if "x" in printer.toolhead.homed_axes %}
                RESPOND TYPE=command MSG="Test3"
                G1 X{parking_position_act_t} F{speed}
            {% endif %}

            # extrude after parking
#            {% if is_printing_gcode %}
#                _EXTRUDE T={new_t}
#            {% endif %}

            # activate new carriage and offset
            SET_DUAL_CARRIAGE CARRIAGE={new_t}
#            _SET_TOOLHEAD_OFFSET T={new_t} MOVE={1 if "xyz" in printer.toolhead.homed_axes else 0}

            # activate new extruder
            ACTIVATE_EXTRUDER EXTRUDER=extruder{'' if new_t == 0 else new_t}

        {% else %}
            {% if "xyz" not in printer.toolhead.homed_axes %}
                # printer is not homed
                RESPOND TYPE=command MSG="Test4"
                # activate the new carriage and offset
                SET_DUAL_CARRIAGE CARRIAGE={new_t}
#                _SET_TOOLHEAD_OFFSET T={new_t}

                # activate new extruder
                ACTIVATE_EXTRUDER EXTRUDER=extruder{'' if new_t == 0 else new_t}

            {% else %}
                # shift the toolheads
                RESPOND TYPE=command MSG="Test5"
                # get needed offsets
                # {% set svv = printer.save_variables.variables %}
                # {% if new_t == default_toolhead %}
                #     {% set xoffset = svv.idex_xoffset %}
                #     {% set yoffset = svv.idex_yoffset %}
                #     {% set zoffset = svv.idex_zoffset %}
                # {% else %}
                #     {% set xoffset = 0 - svv.idex_xoffset %}
                #     {% set yoffset = 0 - svv.idex_yoffset %}
                #     {% set zoffset = 0 - svv.idex_zoffset %}
                # {% endif %}

                # ignore offsets if they have already been applied
                # {% if svv.idex_applied_offset == new_t %}
                #     {% set xoffset = 0 %}
                #     {% set yoffset = 0 %}
                #     {% set zoffset = 0 %}
                # {% endif %}

                # get current z-position
                {% set gcode_z = printer.gcode_move.gcode_position.z|float %}
                {% set toolhead_z = printer.toolhead.position.z|float %}

                {% if new_t == 0 %}
                    RESPOND TYPE=command MSG="Test6"
                    # get values
                    {% set t0_act_x = parking_position_t0 %}
                    {% set t1_act_x = printer.toolhead.position.x|float %}
                    {% set t0_new_x = new_x %}
                    {% set t1_new_x = parking_position_t1 %}
                    {% set t0_distance = t0_new_x - t0_act_x %}
                    {% set t1_distance = t1_new_x - t1_act_x %}


                    # ToDo! Take Toolhead z-offset into account
                    # calculate needed z-hop
#                    {% set calc_z_hop = config_z_hop %}

                    # z-hop before toolchange
#                    DEBUG_ECHO PREFIX="_TOOLCHANGE" MSG="Shifting to T0."
#                    DEBUG_ECHO PREFIX="_TOOLCHANGE" MSG="T0_ACT_X: {t0_act_x}, T1_ACT_X: {t1_act_x}, T0_NEW_X: {t0_new_x}, T1_NEW_X: {t1_new_x}, T0_DISTANCE: {t0_distance}, T1_DISTANCE: {t1_distance}"
#                    _ZHOP_BEFORE_TOOLCHANGE Z_HOP={calc_z_hop} T={new_t} SYNC=1 

                    # make sure T0 is in its correct parking position
                    SET_DUAL_CARRIAGE CARRIAGE=0 MODE=PRIMARY
                    # G1 X{t0_act_x} F{speed}

                    {% if t0_distance >= t1_distance %}
                        # copy move
                        RESPOND TYPE=command MSG="Test7"
                        SET_DUAL_CARRIAGE CARRIAGE=1 MODE=COPY
#                        G1 X{t0_act_x + (t1_new_x - t1_act_x)} Y{new_y + yoffset} F{speed}
                        G1 X{t0_act_x + (t1_new_x - t1_act_x)} Y{new_y} F{speed}

                        # move T0 
                        SET_DUAL_CARRIAGE CARRIAGE=0 MODE=PRIMARY
#                        G1 X{t0_new_x + xoffset} F{speed}
                        G1 X{t0_new_x} F{speed}

                    {% elif t0_distance < t1_distance %}
                        # copy move  
                        RESPOND TYPE=command MSG="Test8"
                        SET_DUAL_CARRIAGE CARRIAGE=1 MODE=COPY
#                        G1 X{t0_new_x + xoffset} Y{new_y + yoffset} F{speed}
                        G1 X{t0_new_x} Y{new_y} F{speed}

                        RESPOND TYPE=command MSG="Test81"

                        # park T1
                        SET_DUAL_CARRIAGE CARRIAGE=1 MODE=PRIMARY
                        G1 X{t1_new_x} F{speed}

                        RESPOND TYPE=command MSG="Test82"

                        # move T0 
                        SET_DUAL_CARRIAGE CARRIAGE=0 MODE=PRIMARY
#                        G1 X{t0_new_x + xoffset} F{speed}
                        G1 X{t0_new_x} F{speed}

                    {% endif %}

                    # Offset move
                    # {% if svv.idex_applied_offset != new_t %}
                    #     SET_GCODE_OFFSET X_ADJUST={xoffset} Y_ADJUST={yoffset} MOVE=0 SPEED={speed}
                    #     G1 X{t0_new_x} Y{new_y} F{speed}
                    #     SET_GCODE_OFFSET Z_ADJUST={zoffset} MOVE=1 SPEED={z_speed}
                    #     SAVE_VARIABLE VARIABLE=idex_applied_offset VALUE=0
                    #     # set nozzle thermal expansion offset
                    # {% endif %}

                    # # calculate needed z-drop
                    # {% set calc_z_drop = config_z_hop %}

                    # z-drop after toolchange (zdrop will bail outside of a print)
                    # _ZDROP_AFTER_TOOLCHANGE Z_DROP={calc_z_drop} T={new_t} SYNC=1 

                {% elif new_t == 1 %}
                    RESPOND TYPE=command MSG="Test9"
                    # get values
                    {% set t0_act_x = printer.toolhead.position.x|float %}
                    {% set t1_act_x = parking_position_t1 %}
                    {% set t0_new_x = parking_position_t0 %}
                    {% set t1_new_x = new_x %}
                    {% set t0_distance = t0_act_x - t0_new_x %}
                    {% set t1_distance = t1_act_x - t1_new_x %}

                    # calculate needed z-hop
 #                   {% set calc_z_hop = config_z_hop %}

                    # z-hop before toolchange (zhop will bail outside of a print)
                    DEBUG_ECHO PREFIX="_TOOLCHANGE" MSG="Shifting to T1."
                    DEBUG_ECHO PREFIX="_TOOLCHANGE" MSG="T0_ACT_X: {t0_act_x}, T1_ACT_X: {t1_act_x}, T0_NEW_X: {t0_new_x}, T1_NEW_X: {t1_new_x}, T0_DISTANCE: {t0_distance}, T1_DISTANCE: {t1_distance}"
#                    _ZHOP_BEFORE_TOOLCHANGE Z_HOP={calc_z_hop} T={new_t} SYNC=1 

                    # make sure T1 is in its correct parking position
                    SET_DUAL_CARRIAGE CARRIAGE=1 MODE=PRIMARY
                    G1 X{t1_act_x} F{speed}

                    {% if t0_distance >= t1_distance %}
                    RESPOND TYPE=command MSG="Test99"
                        # copy move
                        SET_DUAL_CARRIAGE CARRIAGE=1 MODE=COPY
#                        G1 X{t0_act_x - t1_distance + xoffset} Y{new_y + yoffset} F{speed}
                        G1 X{t0_act_x - t1_distance} Y{new_y} F{speed}

                        # park T0
                        SET_DUAL_CARRIAGE CARRIAGE=0 MODE=PRIMARY
#                        G1 X{t0_new_x + xoffset} F{speed}
                        G1 X{t0_new_x} F{speed}

                        # move T1
                        SET_DUAL_CARRIAGE CARRIAGE=1 MODE=PRIMARY

                    {% elif t0_distance < t1_distance %}
                        # copy move
                        SET_DUAL_CARRIAGE CARRIAGE=1 MODE=COPY
#                        G1 X{t0_new_x} Y{new_y + yoffset} F{speed}
                        G1 X{t0_new_x} Y{new_y} F{speed}

                        # move T1
                        SET_DUAL_CARRIAGE CARRIAGE=1 MODE=PRIMARY
#                        G1 X{t1_new_x + xoffset} F{speed}
                        G1 X{t1_new_x} F{speed}

                    {% endif %}

                    # offset correction move
                    # {% if svv.idex_applied_offset != new_t %}
                    #     SET_GCODE_OFFSET X_ADJUST={xoffset} Y_ADJUST={yoffset} MOVE=0 SPEED={speed}
                    #     G1 X{t1_new_x} Y{new_y} F{speed}
                    #     SET_GCODE_OFFSET Z_ADJUST={zoffset} MOVE=1 SPEED={z_speed}
                    #     SAVE_VARIABLE VARIABLE=idex_applied_offset VALUE=1
                    #     DEBUG_ECHO PREFIX="IDEX" MSG="Toolhead offset applied for T1: X={xoffset} Y={yoffset} Z={zoffset}"
                    #     # set nozzle thermal expansion offset
                    # {% endif %}

                    # ToDo! Take Toolhead z-offset into account
                    # calculate needed z-drop
                    # {% set calc_z_drop = config_z_hop %}

                    # z-drop after toolchange  (zdrop will bail outside of a print)
                    # _ZDROP_AFTER_TOOLCHANGE Z_DROP={calc_z_drop} T={new_t} SYNC=1 

                {% endif %}

                # activate new extruder
                ACTIVATE_EXTRUDER EXTRUDER=extruder{'' if new_t == 0 else new_t}

            {% endif %}
        {% endif %}

        # reset acceleration
        SET_VELOCITY_LIMIT ACCEL={max_accel} MINIMUM_CRUISE_RATIO=0.5 SQUARE_CORNER_VELOCITY={square_corner_velocity}

    {% endif %}

[gcode_macro DEBUG_ECHO]
gcode:
    {% set prefix = "DEBUG" %}
    {% set debug = params.DEBUG|default(0)|int %}
    {% if params.PREFIX is defined %}
        {% set prefix = prefix ~ " | " ~ params.PREFIX %}
    {% endif %}
    {% set prefix = prefix ~ ":" %}
    {% set msg = "" %}
    {% if params.MSG is defined %}
        {% set msg = params.MSG %}
    {% else %}
        {% set msg = "No msg parameter provided (this is a bug or unintended use)." %}
    {% endif %}
    {% if not debug %}
        # Print to display if not a debug message
        # M117 {prefix} {msg}
    {% endif %}
    {% if not debug %}
        RESPOND PREFIX="{prefix}" MSG="{msg}"
    {% endif %}