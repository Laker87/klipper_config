[gcode_macro _Probe_Variables]
variable_dock_x: -30.0            ; изменить на свое значение
variable_dock_y: 316.0            ; изменить на свое значение
variable_servo_up: 16             ; изменить на свое значение
variable_servo_down: 106          ; изменить на свое значение
variable_dock_move: 25.0 
gcode:

[homing_override]
axes: xyz
set_position_z: -6
gcode:
    {% set minX = printer.toolhead.axis_minimum.x|float + 0.5 %}
    {% set minY = printer.toolhead.axis_minimum.y|float + 1 %}
    {% set homeX = printer.toolhead.axis_maximum.x|float / 2 %}
    {% set homeY = printer.toolhead.axis_maximum.y|float / 2 %}
    # {% set positionX = printer.toolhead.position.x|float %}
    # {% set positionY = printer.toolhead.position.y|float %}
    G90
    {% if 'X' in params %}
        G28 X
    {% elif 'Y' in params %}
        G28 Y
    {% elif 'Z' in params %}
        SET_KINEMATIC_POSITION Z=0
        G0 Z10 F500
        ATTACH_PROBE
        G0 X{homeX} Y{homeY} F18000
        G28 Z
        G0 Z10 F500
        DETACH_PROBE
        G0 X{minX} Y{minY} F12000
    {% else %}
        SET_KINEMATIC_POSITION Z=0
        G0 Z10 F500
        G28 X
        G28 Y
        ATTACH_PROBE
        G0 X{homeX} Y{homeY} F18000
        G28 Z
        G0 Z10 F500
        DETACH_PROBE
        G0 X{minX} Y{minY} F12000
    {% endif %}

[probe]
pin: ^ebb:PB9                ; use pin PA0 and enable internal pullup resistor as this is an NC switch  use ! to invert if needed
deactivate_on_each_sample: False
x_offset: 0                  ; probe is offset 6 mm from nozzle
y_offset: 22.0               ; probe is +59 mm from nozzle in Y direction
z_offset: 7.95               ; trigger point is 3.85 mm below nozzle. Larger numbers move effective Z0 CLOSER to the nozzle
speed: 7                     ; probing speed of 7 mm/second ideal is <10mm/sec  
samples: 3                   ; number of probes to perform per sample
samples_result: median       ; normalization method: see config reference
sample_retract_dist: 0.7
samples_tolerance: 0.01
samples_tolerance_retries: 3
  
# Macro to Attach Bed Probe
[gcode_macro ATTACH_PROBE]
gcode:
    G90
    QUERY_PROBE
    _ATTACH_PROBE

[gcode_macro _error_if_probe_attached]
gcode:
    QUERY_PROBE
    _do_error_if_probe_attached

[gcode_macro _do_error_if_probe_attached]
gcode:
    {% if not printer.probe.last_query %}
        {action_raise_error("Probe is attached")}
    {% endif %}

# Macro to Attach Bed Probe
[gcode_macro _ATTACH_PROBE]
gcode:
    {% set dockX = printer["gcode_macro _Probe_Variables"].dock_x %}
    {% set dockY = printer["gcode_macro _Probe_Variables"].dock_y %}
    {% set dockMove = printer["gcode_macro _Probe_Variables"].dock_move %}
    {% set servoUp = printer["gcode_macro _Probe_Variables"].servo_up %}
    {% set servoDown = printer["gcode_macro _Probe_Variables"].servo_down %}
    G90
    {% if printer.probe.last_query %}
        G0 X{dockX} Y{dockY} F12000                                 ;  move the carriage to dock position
        SET_SERVO SERVO=probe_servo ANGLE={servoUp}                 ;  move servo up
        M400                                                        ;  wait for moves to finish
        G0 X{dockX} Y{dockY - dockMove} F12000                      ;  move to the front of the dock
        SET_SERVO SERVO=probe_servo ANGLE={servoDown}               ;  move servo down
        M400                                                        ;  wait for moves to finish
        SET_SERVO SERVO=probe_servo WIDTH=0                         ;  disable servo output
    {% endif %}

[gcode_macro _error_if_probe_not_attached]
gcode:
    QUERY_PROBE
    _do_error_if_probe_not_attached

[gcode_macro _do_error_if_probe_not_attached]
gcode:
    {% if printer.probe.last_query %}
        {action_raise_error("Probe is not attached")}
    {% endif %}

# Macro to Detach Bed Probe
[gcode_macro DETACH_PROBE]
gcode:
    G90
    QUERY_PROBE
    _DETACH_PROBE

# Macro to Detach Bed Probe
[gcode_macro _DETACH_PROBE]
gcode:
    {% set dockX = printer["gcode_macro _Probe_Variables"].dock_x %}
    {% set dockY = printer["gcode_macro _Probe_Variables"].dock_y %}
    {% set dockMove = printer["gcode_macro _Probe_Variables"].dock_move %}
    {% set servoUp = printer["gcode_macro _Probe_Variables"].servo_up %}
    {% set servoDown = printer["gcode_macro _Probe_Variables"].servo_down %}
    G90
    {% if not printer.probe.last_query %}                           ; the logic on this needs function check
        G0 X{dockX} Y{dockY - dockMove} F12000                      ;  move to a position in front of the dock so simple linear movement into dock 
        SET_SERVO SERVO=probe_servo ANGLE={servoUp}                 ;  move servo up
        M400                                                        ;  wait for moves to finish
        G0 X{dockX} Y{dockY} F6000                                  ;  move to the re-entry staging position
        G0 X{dockX + dockMove} Y{dockY} F6000                       ;  move to the side of the dock
        SET_SERVO SERVO=probe_servo ANGLE={servoDown}               ;  move servo down
        M400                                                        ;  wait for moves to finish
        # G4 P2000
        SET_SERVO SERVO=probe_servo WIDTH=0                         ;  disable servo output
    {% endif %}                                                     ;  exit the if-then loop. was missing in previous versions

[servo probe_servo]
pin: PG10 #PG6 
maximum_servo_angle: 180
minimum_pulse_width: 0.0005
maximum_pulse_width: 0.0025
initial_angle: 106

