[gcode_macro BED_MESH_CALIBRATE]
rename_existing: BED_MESH_CALIBRATE_ORIGINAL
gcode:
    SAVE_GCODE_STATE NAME=BMC
    ATTACH_PROBE
    BED_MESH_CALIBRATE_ORIGINAL
    DETACH_PROBE
    RESTORE_GCODE_STATE NAME=BMC MOVE=1 MOVE_SPEED=200

[gcode_macro QUAD_GANTRY_LEVEL]
rename_existing: QUAD_GANTRY_LEVEL_ORIGINAL
gcode:
    SAVE_GCODE_STATE NAME=QGL
    ATTACH_PROBE
    QUAD_GANTRY_LEVEL_ORIGINAL
    DETACH_PROBE
    RESTORE_GCODE_STATE NAME=QGL MOVE=1 MOVE_SPEED=200

[gcode_macro SCREWS_TILT_CALCULATE]
